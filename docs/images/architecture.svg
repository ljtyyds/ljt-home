<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="446" viewBox="0 0 1440 446" role="img" aria-label="浏览器工作区、应用服务与本地数据存储和可选模型服务之间的结构及数据边界"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#18213e"/></linearGradient><linearGradient id="accent"><stop stop-color="#8ff5dc"/><stop offset="1" stop-color="#b9b2ff"/></linearGradient><radialGradient id="glow"><stop stop-color="#7e6ee8" stop-opacity=".4"/><stop offset="1" stop-color="#7e6ee8" stop-opacity="0"/></radialGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8fa4d6" stroke-opacity=".07"/></pattern></defs><rect width="1440" height="446" rx="28" fill="url(#bg)"/><rect width="1440" height="446" rx="28" fill="url(#grid)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="48" y="53" fill="#a8a3fa" font-size="12" letter-spacing="3">SMALL STACK, CLEAR BOUNDARIES</text><text x="48" y="98" fill="#f3f6ff" font-size="30" font-weight="700">一个应用，管理两种信息边界</text><rect x="48" y="139" width="400" height="231" rx="18" fill="#1a2a42" stroke="#98afd2" stroke-opacity=".16"/><rect x="72" y="166" width="5" height="28" rx="2.5" fill="#8ff5dc"/><text x="91" y="188" fill="#f2f6ff" font-size="24" font-weight="650">浏览器工作区</text><text x="72" y="222" fill="#8ff5dc" font-size="13">Next.js · React · TypeScript</text><circle cx="77" cy="258" r="2.5" fill="#8098ba"/><text x="91" y="263" fill="#b7c7dd" font-size="14">公开：收藏、资讯、论文</text><circle cx="77" cy="292" r="2.5" fill="#8098ba"/><text x="91" y="297" fill="#b7c7dd" font-size="14">私有：备忘录、待办与正文图片</text><circle cx="77" cy="326" r="2.5" fill="#8098ba"/><text x="91" y="331" fill="#b7c7dd" font-size="14">当前浏览器：背景、外观、缩放</text><rect x="520" y="139" width="400" height="231" rx="18" fill="#1a2a42" stroke="#98afd2" stroke-opacity=".16"/><rect x="544" y="166" width="5" height="28" rx="2.5" fill="#c0b5ff"/><text x="563" y="188" fill="#f2f6ff" font-size="24" font-weight="650">应用服务</text><text x="544" y="222" fill="#c0b5ff" font-size="13">Node.js · Session · Validation</text><circle cx="549" cy="258" r="2.5" fill="#8098ba"/><text x="563" y="263" fill="#b7c7dd" font-size="14">服务端验证身份与数据访问范围</text><circle cx="549" cy="292" r="2.5" fill="#8098ba"/><text x="563" y="297" fill="#b7c7dd" font-size="14">统一内容读取、摘要与分类流程</text><circle cx="549" cy="326" r="2.5" fill="#8098ba"/><text x="563" y="331" fill="#b7c7dd" font-size="14">管理员确认后保存或应用草稿</text><rect x="992" y="139" width="400" height="231" rx="18" fill="#1a2a42" stroke="#98afd2" stroke-opacity=".16"/><rect x="1016" y="166" width="5" height="28" rx="2.5" fill="#f1c094"/><text x="1035" y="188" fill="#f2f6ff" font-size="24" font-weight="650">存储与模型</text><text x="1016" y="222" fill="#f1c094" font-size="13">SQLite + Optional AI API</text><circle cx="1021" cy="258" r="2.5" fill="#8098ba"/><text x="1035" y="263" fill="#b7c7dd" font-size="14">DATA_DIR：数据库、主密钥与图片</text><circle cx="1021" cy="292" r="2.5" fill="#8098ba"/><text x="1035" y="297" fill="#b7c7dd" font-size="14">模型配置保存在服务端</text><circle cx="1021" cy="326" r="2.5" fill="#8098ba"/><text x="1035" y="331" fill="#b7c7dd" font-size="14">AI 使用所配置的模型服务</text><path d="M459 254h48m-7-7 7 7-7 7M931 254h48m-7-7 7 7-7 7" fill="none" stroke="#7992ba" stroke-width="2"/><text x="48" y="410" fill="#93a9c8" font-size="14">管理员使用 AI 时，相关私有资料可能发送至配置的模型服务；请按自己的数据需求选择服务商。</text></g></svg>