<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="452" viewBox="0 0 1440 452" role="img" aria-label="AI 共享整理流程：输入素材、获取有效内容、生成草稿、检查与保存；访问受限时补充文字或截图"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1425"/><stop offset="1" stop-color="#18213e"/></linearGradient><linearGradient id="accent"><stop stop-color="#8ff5dc"/><stop offset="1" stop-color="#b9b2ff"/></linearGradient><radialGradient id="glow"><stop stop-color="#7e6ee8" stop-opacity=".4"/><stop offset="1" stop-color="#7e6ee8" stop-opacity="0"/></radialGradient><pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#8fa4d6" stroke-opacity=".07"/></pattern></defs><rect width="1440" height="452" rx="28" fill="url(#bg)"/><rect width="1440" height="452" rx="28" fill="url(#grid)"/><g font-family="Inter,Segoe UI,Microsoft YaHei,Arial,sans-serif"><text x="48" y="52" fill="#9df1dd" font-size="12" letter-spacing="3">ONE SHARED WORKFLOW</text><text x="48" y="96" fill="#f1f6ff" font-size="30" font-weight="700">从一条链接，到一份有条理的收藏</text><text x="48" y="129" fill="#94a9c6" font-size="15">聊天、关注网站与行业前沿，复用同一套整理服务</text><rect x="48" y="174" width="312" height="143" rx="17" fill="#1b2b43" stroke="#99b4db" stroke-opacity=".17"/><circle cx="84" cy="209" r="18" fill="#8ff5dc" fill-opacity=".14"/><text x="84" y="214" fill="#9ef5df" font-size="12" text-anchor="middle" font-weight="700">01</text><text x="71" y="256" fill="#f3f6ff" font-size="22" font-weight="650">输入素材</text><text x="71" y="286" fill="#a7b8d1" font-size="14">网址 · 正文 · 截图</text><path d="M369 245h14m-5-5 5 5-5 5" stroke="#8b9fbd" stroke-width="1.5" fill="none"/><rect x="390" y="174" width="312" height="143" rx="17" fill="#1b2b43" stroke="#99b4db" stroke-opacity=".17"/><circle cx="426" cy="209" r="18" fill="#8ff5dc" fill-opacity=".14"/><text x="426" y="214" fill="#9ef5df" font-size="12" text-anchor="middle" font-weight="700">02</text><text x="413" y="256" fill="#f3f6ff" font-size="22" font-weight="650">获取有效内容</text><text x="413" y="286" fill="#a7b8d1" font-size="14">读取正文，识别访问限制</text><path d="M711 245h14m-5-5 5 5-5 5" stroke="#8b9fbd" stroke-width="1.5" fill="none"/><rect x="732" y="174" width="312" height="143" rx="17" fill="#1b2b43" stroke="#99b4db" stroke-opacity=".17"/><circle cx="768" cy="209" r="18" fill="#8ff5dc" fill-opacity=".14"/><text x="768" y="214" fill="#9ef5df" font-size="12" text-anchor="middle" font-weight="700">03</text><text x="755" y="256" fill="#f3f6ff" font-size="22" font-weight="650">生成整理草稿</text><text x="755" y="286" fill="#a7b8d1" font-size="14">摘要 · 类型 · 分类 · 标签</text><path d="M1053 245h14m-5-5 5 5-5 5" stroke="#8b9fbd" stroke-width="1.5" fill="none"/><rect x="1074" y="174" width="312" height="143" rx="17" fill="#1b2b43" stroke="#99b4db" stroke-opacity=".17"/><circle cx="1110" cy="209" r="18" fill="#b9b2ff" fill-opacity=".14"/><text x="1110" y="214" fill="#d0caff" font-size="12" text-anchor="middle" font-weight="700">04</text><text x="1097" y="256" fill="#f3f6ff" font-size="22" font-weight="650">检查与保存</text><text x="1097" y="286" fill="#a7b8d1" font-size="14">手动调整，再保存或应用</text><rect x="48" y="345" width="1338" height="41" rx="10" fill="#a3a0ff" fill-opacity=".08"/><text x="70" y="371" fill="#c2cce0" font-size="14">内容获取失败？在同一聊天中补充文字或文章截图，再说明“请根据这些内容整理分类”。</text><text x="48" y="420" fill="#7d95b7" font-size="12">图片分析需要支持视觉输入的模型；公开网页读取受目标网站访问限制。流程示意，不代表已调用模型。</text></g></svg>